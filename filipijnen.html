<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, max-age=0"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="googlebot" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<title>Filipijnen – Krabi Reisgids</title><link rel="icon" href="data:,">
<style>
:root{--g:#1f6f5c;--g2:#e6f2ee;--s:#faf6ef;--o:#c4561c;--o2:#fdebe0;--p:#8a3fa0;--p2:#f4e9f7;--t:#24302c;--m:#5f6b67;--b:#e4ddd0}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;font:18px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--s);color:var(--t)}
a{color:var(--g);text-underline-offset:3px}button{font:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:12px 20px;border:0;border-radius:12px;background:var(--g);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;width:100%}
.btn.sec{background:#fff;color:var(--g);border:2px solid var(--g)}
header.top{position:sticky;top:0;z-index:5;background:var(--s);border-bottom:1px solid var(--b)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding:10px 16px}
header.top b{flex:1;font-size:18px}
h1.hero{font-size:28px;margin:22px 0 4px}.sub{color:var(--m);margin:0 0 16px;font-size:16px}
nav.toc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 8px}
nav.toc a{display:flex;align-items:center;gap:8px;min-height:56px;padding:10px 14px;background:#fff;border:1px solid var(--b);border-radius:14px;text-decoration:none;color:var(--t);font-weight:600;font-size:16px}
.legend{background:#fff;border:1px solid var(--b);border-radius:14px;padding:12px 14px;margin:14px 0;font-size:15px}
.legend div{display:flex;align-items:center;gap:8px;margin:4px 0}
.dot{display:inline-block;width:14px;height:14px;border-radius:4px;flex:none}.dot.w{background:var(--p)}.dot.r{background:var(--g)}
section.card{background:#fff;border:1px solid var(--b);border-radius:18px;padding:18px 16px;margin:18px 0}
section.card>h2{margin:0 0 4px;font-size:24px}.intro{color:var(--m);margin:0 0 10px}
h3{font-size:19px;margin:18px 0 6px;color:var(--g)}
ul.items{list-style:none;padding:0;margin:0}
ul.items li{border-left:4px solid var(--g);background:var(--g2);padding:10px 12px;border-radius:0 10px 10px 0;margin:8px 0}
ul.items li.warn{border-color:var(--o);background:var(--o2)}
.who{font-size:13px;font-weight:600;color:var(--g);display:block;margin-bottom:2px}
.src{font-size:15px;margin-top:8px;color:var(--m);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.src a.bron{display:inline-flex;align-items:center;min-height:40px;padding:4px 0;color:#0b5cad;font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.meta{font-size:14px;color:var(--m);margin-top:6px}
a.igbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;margin-top:10px;padding:12px 16px;border-radius:12px;background:#c13584;color:#fff;font-weight:700;font-size:18px;text-decoration:none;box-shadow:0 2px 6px #c1358455}
a.igbtn:active{transform:scale(.98)}a.igbtn .ic{font-size:20px;line-height:1}
a.igbtn.ext{background:var(--g);box-shadow:none}
.nolink{font-size:14px;color:#8a8f8d;margin-top:8px}
@media(min-width:640px){a.igbtn{width:auto;display:inline-flex}}
.unoff{font-size:12px;background:#fff3cd;color:#7a5b00;border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.tips{margin-top:16px;border:2px dashed var(--p);border-radius:14px;padding:12px;background:var(--p2)}
.tips h3{color:var(--p);margin:0 0 6px}.tips .empty{color:var(--m);font-size:16px;margin:0}
.tips ul{list-style:none;padding:0;margin:0}.tips li{background:#fff;border-left:4px solid var(--p);border-radius:0 10px 10px 0;padding:10px 12px;margin:8px 0}
.tips .who{color:var(--p)}
.villa{display:block;margin:12px 0;font-size:19px;min-height:60px}
.check li{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--b)}
.check{list-style:none;padding:0;margin:0}
.check input{width:28px;height:28px;flex:none;margin-top:2px;accent-color:var(--g)}
.check label{flex:1;cursor:pointer}.check li.done label{color:var(--m);text-decoration:line-through}
.urg{display:inline-block;background:var(--o);color:#fff;font-size:13px;font-weight:700;border-radius:6px;padding:1px 8px;margin-right:6px}
.prog{height:10px;background:var(--b);border-radius:6px;overflow:hidden;margin:8px 0 4px}.prog i{display:block;height:100%;background:var(--g);width:0}
ol.tl{list-style:none;padding:0;margin:0;border-left:3px solid var(--g);margin-left:8px}
ol.tl li{position:relative;padding:4px 0 14px 18px}ol.tl li:before{content:"";position:absolute;left:-9px;top:10px;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--g)}
ol.tl li.u:before{border-color:var(--o);background:var(--o)}ol.tl b{display:block}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--b)}th{color:var(--m);font-weight:600}
.foot{color:var(--m);font-size:14px;text-align:center;margin-top:24px}
.hidden{display:none}
@media(min-width:640px){nav.toc{grid-template-columns:1fr 1fr 1fr}}
.back{display:inline-flex;align-items:center;min-height:44px;padding:6px 12px;border-radius:10px;border:2px solid var(--g);color:var(--g);font-weight:700;text-decoration:none;font-size:16px;background:#fff}
.btn.back2{margin:18px 0 0}
.quote{font-weight:700;color:var(--p);font-size:18px;margin:6px 0}
.note{font-size:14px;background:#fff3cd;color:#7a5b00;border-radius:8px;padding:6px 10px;margin-top:8px}
.tips li b{display:block;font-size:18px;margin-bottom:2px}
table.cmp td:first-child{font-weight:600;min-width:110px}table.cmp td{vertical-align:top}
.tbl{overflow-x:auto;margin:6px 0}
</style></head><body>
<div id="loading" class="wrap" style="padding-top:40px;text-align:center;color:var(--m)">Filipijnen-gids laden…</div>
<div id="app" class="hidden">
<header class="top"><div class="wrap"><b>🇵🇭 Filipijnen</b><a class="back" href="./">← Krabi</a></div></header>
<main class="wrap" id="main"></main></div>
<script>
const $=id=>document.getElementById(id);
async function load(){const r=await fetch('data/filipijnen.json?v='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache'}});if(!r.ok)throw new Error('net');return r.json()}
function el(tag,attrs,...kids){const n=document.createElement(tag);if(attrs)for(const[k,v]of Object.entries(attrs)){if(v==null)continue;if(k==='class')n.className=v;else if(k==='text')n.textContent=v;else n.setAttribute(k,v)}for(const k of kids){if(k==null)continue;n.append(k)}return n}
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:null;
function srcs(list){if(!list||!list.length)return null;const d=el('div',{class:'src'});list.forEach(s=>{const u=safeUrl(s.u);const w=el('span');w.append(u?el('a',{class:'bron',href:u,target:'_blank',rel:'noopener noreferrer',text:'Bron: '+s.l}):document.createTextNode('Bron: '+s.l));if(s.off===false)w.append(el('span',{class:'unoff',text:'niet-officiële bron'}));d.append(w)});return d}
const isIG=u=>{try{return /(^|\.)instagram\.com$/i.test(new URL(u).hostname)}catch(e){return false}};
function tipBtn(t){const u=safeUrl(t.url);if(!u)return el('div',{class:'nolink',text:'Link niet gevonden'});
 if(!isIG(u))return el('a',{class:'igbtn ext',href:u,target:'_blank',rel:'noopener noreferrer'},el('span',{class:'ic',text:'🔗'}),'Open link');
 const m=(t.media||'').toLowerCase();let label='Bekijk op Instagram';if(m==='video')label='Bekijk filmpje op Instagram';else if(m==='foto')label='Bekijk post op Instagram';
 return el('a',{class:'igbtn',href:u,target:'_blank',rel:'noopener noreferrer','aria-label':label+(t.title?': '+t.title:'')},el('span',{class:'ic','aria-hidden':'true',text:'▶'}),label)}
const CK='filipijnen-checklist';let CH;try{CH=JSON.parse(localStorage.getItem(CK))||{}}catch(e){CH={}}
function table(tb){const w=el('div');if(tb.title)w.append(el('h3',{text:tb.title}));const t=el('table',{class:'cmp'});
 t.append(el('tr',null,...tb.head.map(h=>el('th',{text:h}))));tb.rows.forEach(r=>t.append(el('tr',null,...r.map(v=>el('td',{text:v})))));
 w.append(el('div',{class:'tbl'},t));const ul=el('ul',{class:'items'},el('li',null,el('span',{class:'who',text:'Aangevuld door Krabi Reisgids'}),el('div',{text:'Bronnen bij deze tabel:'}),srcs(tb.src)));w.append(ul);return w}
function start(d){
 $('loading').classList.add('hidden');$('app').classList.remove('hidden');
 const g=d.gids,tips=d.tips||[],M=$('main');M.textContent='';
 M.append(el('h1',{class:'hero',text:g.title}),el('p',{class:'sub',text:g.subtitle+' Feiten gecontroleerd op '+fmt(g.checked)+'. Regels kunnen veranderen: kijk vlak voor vertrek nog even op de officiële sites.'}));
 M.append(el('div',{class:'legend'},el('div',null,el('span',{class:'dot w'}),el('span',{text:'Van Kim (Instagram)'})),el('div',null,el('span',{class:'dot r'}),el('span',{text:'Aangevuld door Krabi Reisgids, met bronlink'})),el('div',null,el('span',{class:'unoff',text:'niet-officiële bron'}),el('span',{text:' = handig, maar niet van een overheid of de organisatie zelf'}))));
 const toc=el('nav',{class:'toc','aria-label':'Inhoud'});toc.append(el('a',{href:'#checklist'},'✅ Checklist'));
 g.sections.forEach(s=>toc.append(el('a',{href:'#'+s.id},(s.icon||'')+' '+s.title)));M.append(toc);
 const cs=el('section',{class:'card',id:'checklist'},el('h2',{text:'✅ Checklist Filipijnen'}),el('p',{class:'intro',text:'Vink af wat klaar is. Dit wordt op dit apparaat onthouden (los van de Krabi-checklist).'}));
 const pr=el('div',{class:'prog'},el('i')),pt=el('div',{class:'src'});cs.append(pr,pt);const ul=el('ul',{class:'check'});
 const upd=()=>{const n=g.checklist.filter(c=>CH[c.id]).length;pr.firstChild.style.width=(100*n/g.checklist.length)+'%';pt.textContent=n+' van '+g.checklist.length+' klaar'};
 g.checklist.forEach(c=>{const id='fck-'+c.id,cb=el('input',{type:'checkbox',id});cb.checked=!!CH[c.id];const lab=el('label',{for:id});if(c.urgent)lab.append(el('span',{class:'urg',text:'BELANGRIJK'}));lab.append(c.t);
  const li=el('li',{class:CH[c.id]?'done':null},cb,lab);cb.onchange=()=>{if(cb.checked)CH[c.id]=true;else delete CH[c.id];localStorage.setItem(CK,JSON.stringify(CH));li.classList.toggle('done',cb.checked);upd()};ul.append(li)});
 cs.append(ul);upd();M.append(cs);
 g.sections.forEach(s=>{const sec=el('section',{class:'card',id:s.id},el('h2',{text:(s.icon||'')+' '+s.title}));if(s.intro)sec.append(el('p',{class:'intro',text:s.intro}));
  (s.tables||[]).forEach(tb=>sec.append(table(tb)));
  (s.groups||[]).forEach(gr=>{sec.append(el('h3',{text:gr.title}));const u=el('ul',{class:'items'});
   gr.items.forEach(it=>u.append(el('li',{class:it.warn?'warn':null},el('span',{class:'who',text:'Aangevuld door Krabi Reisgids'}),el('div',{text:it.t}),srcs(it.src))));sec.append(u)});
  const mine=tips.filter(t=>t.section===s.id);
  if(mine.length||s.id==='tips-kim'){const tb=el('div',{class:'tips'},el('h3',{text:'💜 Van Kim'}));
   if(!mine.length)tb.append(el('p',{class:'empty',text:'Nog geen tips. Die komen hier zodra ze binnen zijn.'}));
   else{const tu=el('ul');mine.forEach(t=>{const li=el('li',null,el('span',{class:'who',text:'Van Kim (Instagram)'+(t.topic?' · '+t.topic:'')}));
    if(t.title)li.append(el('b',{text:t.title}));if(t.quote)li.append(el('div',{class:'quote',text:'Kim: “'+t.quote+'”'}));
    li.append(el('div',{text:t.text}));if(t.note)li.append(el('div',{class:'note',text:t.note}));
    const meta=[t.account?'gedeelde post van '+t.account:'',t.media==='video'?'filmpje':(t.media==='foto'?'foto':''),t.date||''].filter(Boolean).join(' · ');
    if(meta)li.append(el('div',{class:'meta',text:meta}));li.append(tipBtn(t));tu.append(li)});tb.append(tu)}
   sec.append(tb)}
  M.append(sec)});
 M.append(el('a',{class:'btn sec back2',href:'./',text:'← Terug naar de Krabi Reisgids'}));
 M.append(el('p',{class:'foot',text:'Laatst bijgewerkt: '+fmt(d.updated)+'. Alleen voor ons gezin; niet delen.'}));
}
function fmt(s){try{return new Date(s).toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'})}catch(e){return s}}
load().then(start).catch(()=>{$('loading').textContent='De Filipijnen-gids kon niet worden geladen. Controleer je internet en vernieuw de pagina.'});
</script></body></html>
