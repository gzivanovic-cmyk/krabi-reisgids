<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, max-age=0"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="googlebot" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<title>Krabi Reisgids</title><link rel="icon" href="data:,">
<style>
:root{--g:#1f6f5c;--g2:#e6f2ee;--s:#faf6ef;--o:#c4561c;--o2:#fdebe0;--p:#8a3fa0;--p2:#f4e9f7;--t:#24302c;--m:#5f6b67;--b:#e4ddd0}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;font:18px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--s);color:var(--t)}
a{color:var(--g);text-underline-offset:3px}button{font:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:12px 20px;border:0;border-radius:12px;background:var(--g);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;width:100%}
.btn.sec{background:#fff;color:var(--g);border:2px solid var(--g)}
header.top{position:sticky;top:0;z-index:5;background:var(--s);border-bottom:1px solid var(--b)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding:10px 16px}
header.top b{flex:1;font-size:18px}
h1.hero{font-size:28px;margin:22px 0 4px}.sub{color:var(--m);margin:0 0 16px;font-size:16px}
nav.toc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 8px}
nav.toc a{display:flex;align-items:center;gap:8px;min-height:56px;padding:10px 14px;background:#fff;border:1px solid var(--b);border-radius:14px;text-decoration:none;color:var(--t);font-weight:600;font-size:16px}
.legend{background:#fff;border:1px solid var(--b);border-radius:14px;padding:12px 14px;margin:14px 0;font-size:15px}
.legend div{display:flex;align-items:center;gap:8px;margin:4px 0}
.dot{display:inline-block;width:14px;height:14px;border-radius:4px;flex:none}.dot.w{background:var(--p)}.dot.r{background:var(--g)}
section.card{background:#fff;border:1px solid var(--b);border-radius:18px;padding:18px 16px;margin:18px 0}
section.card>h2{margin:0 0 4px;font-size:24px}.intro{color:var(--m);margin:0 0 10px}
h3{font-size:19px;margin:18px 0 6px;color:var(--g)}
ul.items{list-style:none;padding:0;margin:0}
ul.items li{border-left:4px solid var(--g);background:var(--g2);padding:10px 12px;border-radius:0 10px 10px 0;margin:8px 0}
ul.items li.warn{border-color:var(--o);background:var(--o2)}
.who{font-size:13px;font-weight:600;color:var(--g);display:block;margin-bottom:2px}
.src{font-size:15px;margin-top:8px;color:var(--m);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.src a.bron{display:inline-flex;align-items:center;min-height:40px;padding:4px 0;color:#0b5cad;font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.meta{font-size:14px;color:var(--m);margin-top:6px}
a.igbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;margin-top:10px;padding:12px 16px;border-radius:12px;background:#c13584;color:#fff;font-weight:700;font-size:18px;text-decoration:none;box-shadow:0 2px 6px #c1358455}
a.igbtn:active{transform:scale(.98)}a.igbtn .ic{font-size:20px;line-height:1}
a.igbtn.ext{background:var(--g);box-shadow:none}
.nolink{font-size:14px;color:#8a8f8d;margin-top:8px}
@media(min-width:640px){a.igbtn{width:auto;display:inline-flex}}
.unoff{font-size:12px;background:#fff3cd;color:#7a5b00;border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.tips{margin-top:16px;border:2px dashed var(--p);border-radius:14px;padding:12px;background:var(--p2)}
.tips h3{color:var(--p);margin:0 0 6px}.tips .empty{color:var(--m);font-size:16px;margin:0}
.tips ul{list-style:none;padding:0;margin:0}.tips li{background:#fff;border-left:4px solid var(--p);border-radius:0 10px 10px 0;padding:10px 12px;margin:8px 0}
.tips .who{color:var(--p)}
.villa{display:block;margin:12px 0;font-size:19px;min-height:60px}
.check li{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--b)}
.check{list-style:none;padding:0;margin:0}
.check input{width:28px;height:28px;flex:none;margin-top:2px;accent-color:var(--g)}
.check label{flex:1;cursor:pointer}.check li.done label{color:var(--m);text-decoration:line-through}
.urg{display:inline-block;background:var(--o);color:#fff;font-size:13px;font-weight:700;border-radius:6px;padding:1px 8px;margin-right:6px}
.prog{height:10px;background:var(--b);border-radius:6px;overflow:hidden;margin:8px 0 4px}.prog i{display:block;height:100%;background:var(--g);width:0}
ol.tl{list-style:none;padding:0;margin:0;border-left:3px solid var(--g);margin-left:8px}
ol.tl li{position:relative;padding:4px 0 14px 18px}ol.tl li:before{content:"";position:absolute;left:-9px;top:10px;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--g)}
ol.tl li.u:before{border-color:var(--o);background:var(--o)}ol.tl b{display:block}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--b)}th{color:var(--m);font-weight:600}
.foot{color:var(--m);font-size:14px;text-align:center;margin-top:24px}
.hidden{display:none}
header.top a.ph{display:inline-flex;align-items:center;min-height:44px;padding:6px 12px;border-radius:10px;background:#0b5cad;color:#fff;font-weight:700;text-decoration:none;font-size:15px}
@media print{header.top a.ph,a.btn.villa[href='filipijnen.html']{display:none!important}}
@media(min-width:640px){nav.toc{grid-template-columns:1fr 1fr 1fr}}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar button,.toolbar select{font:inherit;border:1px solid var(--b);background:#fff;border-radius:9px;padding:9px 12px;color:var(--g);cursor:pointer}
.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fieldgrid label{font-size:15px;display:block}.fieldgrid input{width:100%;min-width:0;font:inherit;padding:10px;border:1px solid var(--b);border-radius:8px;background:#fff;margin-top:5px}
summary{cursor:pointer;font-weight:650;padding:8px 0}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #c4561c;outline-offset:3px}
.check .detail-link{font-size:14px;display:block;margin-top:5px}.check[hidden],.check li[hidden]{display:none}.notice{background:var(--g2);border-radius:12px;padding:14px;margin:12px 0}.priority{border-left:5px solid var(--o)!important}
@media(max-width:420px){.fieldgrid{grid-template-columns:1fr}nav.toc{gap:6px}nav.toc a{padding:8px;font-size:14px}}
@media print{header.top,nav.toc,.toolbar,.tips,.legend{display:none!important}body{font-size:11pt;background:white}.wrap{max-width:none;padding:0}section.card{border:0;border-bottom:1px solid #ddd;margin:10px 0;padding:10px 0}h2,h3{break-after:avoid}li{break-inside:avoid}.src a{font-size:9pt}input{border:0}details>*{display:block!important}}
</style></head><body>
<div id="loading" class="wrap" style="padding-top:40px;text-align:center;color:var(--m)">Reisgids laden…</div>
<div id="app" class="hidden">
<header class="top"><div class="wrap"><b>🌴 Krabi Reisgids</b><a class="ph" href="filipijnen.html">🇵🇭 Filipijnen</a></div></header>
<main class="wrap" id="main"></main></div>
<script>
const $=id=>document.getElementById(id);
async function load(){const r=await fetch('data/gids.json?v='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache'}});if(!r.ok)throw new Error('net');return r.json()}
// veilige DOM-helpers (geen innerHTML met data)
function el(tag,attrs,...kids){const n=document.createElement(tag);if(attrs)for(const[k,v]of Object.entries(attrs)){if(v==null)continue;if(k==='class')n.className=v;else if(k==='text')n.textContent=v;else n.setAttribute(k,v)}for(const k of kids){if(k==null)continue;n.append(k)}return n}
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:null;
function link(u,label){const s=safeUrl(u);return s?el('a',{href:s,target:'_blank',rel:'noopener noreferrer',text:label}):document.createTextNode(label)}
function srcs(list){if(!list||!list.length)return null;const d=el('div',{class:'src'});list.forEach(s=>{const u=safeUrl(s.u);const w=el('span');w.append(u?el('a',{class:'bron',href:u,target:'_blank',rel:'noopener noreferrer',text:'Bron: '+s.l}):document.createTextNode('Bron: '+s.l));if(s.off===false)w.append(el('span',{class:'unoff',text:'niet-officiële bron'}));d.append(w)});return d}
const isIG=u=>{try{return /(^|\.)instagram\.com$/i.test(new URL(u).hostname)}catch(e){return false}};
function tipBtn(t){const u=safeUrl(t.url);if(!u)return el('div',{class:'nolink',text:'Link niet gevonden'});
 if(!isIG(u))return el('a',{class:'igbtn ext',href:u,target:'_blank',rel:'noopener noreferrer'},el('span',{class:'ic',text:'🔗'}),'Open link');
 const m=(t.media||'').toLowerCase(),txt=((t.text||'')+' '+(t.title||'')).toLowerCase();
 let label='Bekijk op Instagram';if(m==='video'||m==='reel'||/\bvideo\b|filmpje|\breel\b/.test(txt))label='Bekijk filmpje op Instagram';else if(m==='foto'||m==='post')label='Bekijk post op Instagram';
 return el('a',{class:'igbtn',href:u,target:'_blank',rel:'noopener noreferrer','aria-label':label+(t.title?': '+t.title:'')},el('span',{class:'ic','aria-hidden':'true',text:'▶'}),label)}
function remember(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch(e){const n=$('save-status');if(n)n.textContent='Opslaan is geblokkeerd in deze browser. Houd je gegevens apart bij.';return false}}
const CK='krabi-checklist';let CH;try{CH=JSON.parse(localStorage.getItem(CK))||{}}catch(e){CH={}}
function start(d){
 $('loading').classList.add('hidden');$('app').classList.remove('hidden');
 const g=d.gids,tips=d.tips||[],M=$('main');M.textContent='';g.checklist.forEach(c=>{if(c.done && !(c.id in CH))CH[c.id]=true});
 M.append(el('h1',{class:'hero',text:g.title}),el('p',{class:'sub',text:g.subtitle||'Praktisch overzicht voor het gezin.'}));
 const lg=el('div',{class:'legend'},el('div',null,el('span',{class:'dot w'}),el('span',{text:'Van je vrouw (Instagram)'})),el('div',null,el('span',{class:'dot r'}),el('span',{text:'Aangevuld door Krabi Reisgids, met bronlink'})),el('div',null,el('span',{class:'unoff',text:'niet-officiële bron'}),el('span',{text:' = handig, maar niet van een overheid of het bedrijf zelf'})));
 M.append(lg);
 M.append(el('a',{class:'btn villa',href:'filipijnen.html',style:'background:#0b5cad'},'🇵🇭 Filipijnen: wonen & werken (6+ maanden) →'));
 const actions=el('div',{class:'toolbar'}),print=el('button',{type:'button',text:'Afdrukken / PDF'});print.onclick=()=>window.print();actions.append(el('a',{class:'btn',href:'#eerst-regelen',text:'Begin hier: eerst regelen'}),print);M.append(actions);
 const plan=el('details',{class:'card'});plan.append(el('summary',{text:'✍️ Ons persoonlijke overzicht invullen'}),el('p',{class:'intro',id:'save-status',text:'Alleen opgeslagen in deze browser, niet gedeeld of gesynchroniseerd. Geen paspoortnummers of medische gegevens invullen.'}));
 let P={};try{P=JSON.parse(localStorage.getItem('krabi-plan-v3'))||{}}catch(e){}
 const fields=el('div',{class:'fieldgrid'});
 [['arrival','Aankomst Thailand','date'],['departure','Geplande vertrekdatum Thailand','date'],['monthly','Totaal maandbudget (€)','number'],['reserve','Apart beschikbare buffer (€)','number']].forEach(([id,label,type])=>{const inp=el('input',{id:'plan-'+id,type,min:type==='number'?'0':null,step:type==='number'?'0.01':null});inp.value=P[id]||'';inp.oninput=()=>{P[id]=inp.value;remember('krabi-plan-v3',P);duration()};fields.append(el('label',{for:'plan-'+id},label,inp))});
 const days=el('p',{class:'notice','aria-live':'polite'});
 function duration(){if(!P.arrival||!P.departure){days.textContent='Reisdata nog te bepalen. Het resort telt mee in de totale reisduur.';return}const n=Math.round((Date.parse(P.departure)-Date.parse(P.arrival))/86400000)+1;days.textContent=n>0?'Geplande duur: '+n+' dagen, inclusief aankomst- en vertrekdag. Vergelijk dit met de inreisstempel per persoon; dit is geen visumberekening.':'De einddatum moet op of na de aankomstdatum liggen.'}
 plan.append(fields,days);duration();M.append(plan);
 const toc=el('nav',{class:'toc','aria-label':'Inhoud'});
 toc.append(el('a',{href:'#checklist'},'✅ Checklist'),el('a',{href:'#tijdlijn'},'🗓️ Tijdlijn'));
 g.sections.forEach(s=>toc.append(el('a',{href:'#'+s.id},(s.icon||'')+' '+s.title)));M.append(toc);
 // checklist
 const cs=el('section',{class:'card',id:'checklist'},el('h2',{text:'✅ Checklist'}),el('p',{class:'intro',text:'Vink af na controle. Opgeslagen op dit apparaat. Gewijzigde controlepunten moeten opnieuw worden beoordeeld.'}));
 const pr=el('div',{class:'prog'},el('i')),pt=el('div',{class:'src'});cs.append(pr,pt);
 const ul=el('ul',{class:'check'});
 const upd=()=>{const n=g.checklist.filter(c=>CH[c.id]).length;pr.firstChild.style.width=(100*n/g.checklist.length)+'%';pt.textContent=n+' van '+g.checklist.length+' klaar'};
 g.checklist.forEach(c=>{const id='ck-'+c.id,cb=el('input',{type:'checkbox',id});cb.checked=!!CH[c.id];
  const lab=el('label',{for:id});if(c.urgent)lab.append(el('span',{class:'urg',text:'URGENT'}));lab.append(c.t);
  lab.append(el('a',{class:'detail-link',href:'#'+c.sec,text:(c.phase||'Vóór vertrek')+' · Lees toelichting'}));
  const li=el('li',{class:CH[c.id]?'done':null,'data-phase':c.phase||'Vóór vertrek'},cb,lab);
  cb.onchange=()=>{CH[c.id]=cb.checked;remember(CK,CH);li.classList.toggle('done',cb.checked);upd()};ul.append(li)});
 const filters=el('div',{class:'toolbar'}),select=el('select',{'aria-label':'Filter checklist op fase'});['Alles','Vóór vertrek','Laatste dagen','In Thailand'].forEach(x=>select.append(el('option',{value:x,text:x})));const only=el('input',{type:'checkbox',id:'only-open'}),onlyLabel=el('label',{for:'only-open'},only,' Alleen open');
 const filter=()=>{Array.from(ul.children).forEach(li=>{li.hidden=(select.value!=='Alles'&&li.dataset.phase!==select.value)||(only.checked&&li.classList.contains('done'))})};select.onchange=filter;only.onchange=filter;ul.addEventListener('change',filter);filters.append(select,onlyLabel);cs.append(filters,ul);upd();M.append(cs);
 // tijdlijn
 const ts=el('section',{class:'card',id:'tijdlijn'},el('h2',{text:'🗓️ Tijdlijn'}),el('p',{class:'intro',text:'Relatieve planning voor ongeveer zes maanden totaal. Exacte data nog te bevestigen.'}));
 const ol=el('ol',{class:'tl'});g.timeline.forEach(t=>ol.append(el('li',{class:t.urgent?'u':null},el('b',{text:t.when}),t.t)));ts.append(ol);M.append(ts);
 // secties
 g.sections.forEach(s=>{const sec=el('section',{class:'card',id:s.id},el('h2',{text:(s.icon||'')+' '+s.title}));
  if(s.intro)sec.append(el('p',{class:'intro',text:s.intro}));
  if(s.link&&safeUrl(s.link.u))sec.append(el('a',{class:'btn villa',href:s.link.u,target:'_blank',rel:'noopener noreferrer',text:'🏡 '+s.link.l+' →'}));
  (s.groups||[]).forEach(gr=>{sec.append(el('h3',{text:gr.title}));const u=el('ul',{class:'items'});
   gr.items.forEach(it=>u.append(el('li',{class:it.warn?'warn':null},el('span',{class:'who',text:it.src&&it.src.length?'Informatie met bron':'Praktisch actiepunt'}),el('div',{text:it.t}),srcs(it.src))));sec.append(u)});
  if(s.weather){sec.append(el('h3',{text:'Weer in Krabi (november – mei)'}));const tb=el('table');
   tb.append(el('tr',null,el('th',{text:'Maand'}),el('th',{text:'Max °C'}),el('th',{text:'Min °C'}),el('th',{text:'Regen mm'}),el('th',{text:'Regendagen'})));
   s.weather.rows.forEach(r=>tb.append(el('tr',null,...r.map(v=>el('td',{text:String(v).replace('.',',')})))));
   const ul2=el('ul',{class:'items'},el('li',null,el('span',{class:'who',text:'Aangevuld door Krabi Reisgids'}),el('div',{text:s.weather.note}),srcs(s.weather.src)));sec.append(el('div',{style:'overflow-x:auto'},tb),ul2)}
  const mine=tips.filter(t=>t.section===s.id),tb=el('div',{class:'tips'},el('h3',{text:'💜 Tips van je vrouw'}));
  if(!mine.length)tb.append(el('p',{class:'empty',text:'Nog geen tips voor dit onderdeel. Die komen hier zodra ze binnen zijn.'}));
  else{const tu=el('ul');mine.forEach(t=>{const li=el('li',null,el('span',{class:'who',text:'Van je vrouw (Instagram)'+(t.topic?' · '+t.topic:'')}));
    const meta=[t.account?'gedeelde post van '+t.account:(t.type||''),t.date||''].filter(Boolean).join(' · ');
    if(t.title)li.append(el('b',{text:t.title}));li.append(el('div',{text:t.text}));if(meta)li.append(el('div',{class:'meta',text:meta}));li.append(tipBtn(t));tu.append(li)});tb.append(tu)}
  if(mine.length)sec.append(tb);if(s.id==='eerst-regelen'){sec.classList.add('priority');M.insertBefore(sec,cs)}else M.append(sec)});
 M.append(el('p',{class:'foot',text:'Laatst bijgewerkt: '+fmt(d.updated)+'. Deze website is openbaar bereikbaar. Bewaar persoonlijke documenten privé. Regels en tarieven opnieuw controleren vóór gebruik.'}));
}
function fmt(s){try{return new Date(s).toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'})}catch(e){return s}}
load().then(start).catch(()=>{$('loading').textContent='De reisgids kon niet worden geladen. Controleer je internet en vernieuw de pagina.'});
</script></body></html>
